<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>精鋭地図博士への道</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
        body { 
            font-family: 'Noto Sans JP', sans-serif; 
            margin: 0;
            background-color: #74b44a;
        }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .shake-animation { animation: shake 0.1s infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SYMBOLS = {
          level1: [
            { id: 'school', name: '小・中学校', category: '学校', desc: '「文」の文字をデザインしたもの。' },
            { id: 'post', name: '郵便局', category: '公共施設', desc: '昔の郵便マーク「〒」から。' },
            { id: 'police', name: '交番', category: '警察', desc: '警棒をクロスさせた形。' },
            { id: 'city_hall', name: '市役所', category: '公共施設', desc: '二重の丸は大きな役所を表すよ。' },
            { id: 'fire_station', name: '消防署', category: '公共施設', desc: '火消しの道具「さすまた」の形。' },
            { id: 'hospital', name: '病院', category: '医療', desc: '十字マークが建物の形に入っているよ。' },
            { id: 'temple', name: '寺院', category: '宗教', desc: '「卍（まんじ）」というマークだよ。' },
            { id: 'shrine', name: '神社', category: '宗教', desc: '鳥居（とりい）の形をしているよ。' },
            { id: 'field', name: '畑', category: '土地利用', desc: '植物の二葉が芽生えた形。' },
            { id: 'rice_field', name: '田', category: '土地利用', desc: '田んぼのあぜ道をデザインしたもの。' },
            { id: 'orchard', name: '果樹園', category: '土地利用', desc: 'リンゴの形をデザインしているよ。' },
            { id: 'park', name: '公園', category: '施設', desc: '木やベンチがある憩いの場。' },
          ],
          level2: [
            { id: 'sdf', name: '自衛隊', category: '防衛', desc: '旗のような形。災害救助の拠点にもなる。' },
            { id: 'meteo', name: '気象台', category: '公共施設', desc: '風速計の羽をデザインしたもの。' },
            { id: 'power_plant', name: '発電所', category: 'インフラ', desc: '電気の回路をデザインしているよ。' },
            { id: 'health_center', name: '保健所', category: '医療・公共', desc: '清潔な建物のイメージ。' },
            { id: 'prosecutor', name: '検察庁', category: '司法', desc: '秋の霜が降りた菊の葉をイメージ。' },
            { id: 'court', name: '裁判所', category: '司法', desc: '裁判を知らせる立て札の形。' },
            { id: 'tax_office', name: '税務署', category: '公共施設', desc: 'そろばんの玉のデザイン。' },
            { id: 'factory', name: '工場', category: '産業', desc: '歯車の形。都市計画で重要。' },
            { id: 'library', name: '図書館', category: '教育', desc: '開いた本を上から見た形。' },
            { id: 'bank', name: '銀行', category: '金融', desc: '昔のお金の形「分銅」から。' },
            { id: 'museum', name: '博物館', category: '文化', desc: 'ギリシャ神殿のような立派な柱。' },
            { id: 'high_school', name: '高等学校', category: '学校', desc: '「文」の周りに丸囲みがあるよ。' },
          ],
          level3: [
            { id: 'electronic_base', name: '電子基準点', category: '測量', desc: '最新の測量ポイント。ひし形が特徴。' },
            { id: 'radio_tower', name: '電波塔', category: '航空・通信', desc: 'パイロットが障害物として確認する重要な目印。' },
            { id: 'chimney', name: '煙突', category: '測量・産業', desc: '高くそびえる構造物。目立つので目標物になる。' },
            { id: 'triangulation', name: '三角点', category: '測量', desc: '地図作成の根幹。測量士の聖地。' },
            { id: 'bench_mark', name: '水準点', category: '測量', desc: '高さを決める基準。道路脇によくある。' },
            { id: 'important_port', name: '重要港', category: '海運・冒険', desc: '大きな船が停まれる特別な港。' },
            { id: 'waste_land', name: '荒地', category: '地形・サバイバル', desc: '石が多く植物が育たない場所。' },
            { id: 'coniferous', name: '針葉樹林', category: '地形', desc: '尖った木の形。寒冷地や山地に多い。' },
            { id: 'broadleaf', name: '広葉樹林', category: '地形', desc: '丸い木の形。四季の変化がわかる。' },
            { id: 'bamboo', name: '竹林', category: '地形', desc: '竹が生い茂っている場所。' },
            { id: 'hot_spring', name: '温泉', category: '名所', desc: '地面から湯気が噴き出している様子。' },
            { id: 'oil_well', name: '油井・ガス井', category: '資源', desc: 'エネルギーを採掘するやぐらの形。' },
          ]
        };

        const ALL_SYMBOLS = [...SYMBOLS.level1, ...SYMBOLS.level2, ...SYMBOLS.level3];

        const MapIcon = ({ type, size = "32" }) => {
          const stroke = "currentColor";
          const fill = "none";
          switch (type) {
            case 'school': return <span className="text-2xl font-bold">文</span>;
            case 'post': return <span className="text-2xl font-bold">〒</span>;
            case 'police': return <svg width={size} height={size} viewBox="0 0 100 100"><line x1="20" y1="20" x2="80" y2="80" stroke={stroke} strokeWidth="12"/><line x1="80" y1="20" x2="20" y2="80" stroke={stroke} strokeWidth="12"/></svg>;
            case 'city_hall': return <svg width={size} height={size} viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill={fill} stroke={stroke} strokeWidth="4"/><circle cx="50" cy="50" r="20" fill={fill} stroke={stroke} strokeWidth="10"/></svg>;
            case 'fire_station': return <svg width={size} height={size} viewBox="0 0 100 100"><line x1="50" y1="20" x2="50" y2="80" stroke={stroke} strokeWidth="10"/><line x1="50" y1="25" x2="15" y2="45" stroke={stroke} strokeWidth="10"/><line x1="50" y1="25" x2="85" y2="45" stroke={stroke} strokeWidth="10"/></svg>;
            case 'hospital': return <svg width={size} height={size} viewBox="0 0 100 100"><path d="M50 15 L85 35 V85 H15 V35 Z" fill={fill} stroke={stroke} strokeWidth="6"/><path d="M50 45 V75 M35 60 H65" stroke={stroke} strokeWidth="8"/></svg>;
            case 'temple': return <span className="text-2xl font-bold">卍</span>;
            case 'shrine': return <svg width={size} height={size} viewBox="0 0 100 100"><path d="M15 35 H85 M15 55 H85 M35 35 V85 M65 35 V85" fill={fill} stroke={stroke} strokeWidth="10"/></svg>;
            case 'field': return <svg width={size} height={size} viewBox="0 0 100 100"><path d="M30 40 L50 75 L70 40" fill={fill} stroke={stroke} strokeWidth="12"/></svg>;
            case 'rice_field': return <svg width={size} height={size} viewBox="0 0 100 100"><path d="M30 25 V75 M70 25 V75 M30 50 H70" fill={fill} stroke={stroke} strokeWidth="10"/></svg>;
            case 'orchard': return <svg width={size} height={size} viewBox="0 0 100 100"><circle cx="50" cy="50" r="25" fill={fill} stroke={stroke} strokeWidth="8"/><line x1="50" y1="25" x2="50" y2="10" stroke={stroke} strokeWidth="8"/></svg>;
            case 'park': return <svg width={size} height={size} viewBox="0 0 100 100"><circle cx="50" cy="40" r="15" fill={fill} stroke={stroke} strokeWidth="6"/><path d="M50 55 V80 M30 80 H70" stroke={stroke} strokeWidth="8"/></svg>;
            case 'sdf': return <svg width={size} height={size} viewBox="0 0 100 100"><path d="M25 15 V85 M25 15 H75 L60 40 L75 65 H25" fill={fill} stroke={stroke} strokeWidth="10"/></svg>;
            case 'meteo': return <svg width={size} height={size} viewBox="0 0 100 100"><circle cx="50" cy="50" r="15" fill={fill} stroke={stroke} strokeWidth="6"/><path d="M50 35 V15 M50 65 V85 M35 50 H15 M65 50 H85" stroke={stroke} strokeWidth="8"/></svg>;
            case 'power_plant': return <svg width={size} height={size} viewBox="0 0 100 100"><circle cx="50" cy="50" r="35" fill={fill} stroke={stroke} strokeWidth="6"/><path d="M30 30 L70 70 M70 30 L30 70" stroke={stroke} strokeWidth="8"/></svg>;
            case 'health_center': return <svg width={size} height={size} viewBox="0 0 100 100"><rect x="20" y="30" width="60" height="50" fill={fill} stroke={stroke} strokeWidth="6"/><path d="M50 15 V30" stroke={stroke} strokeWidth="8"/></svg>;
            case 'prosecutor': return <svg width={size} height={size} viewBox="0 0 100 100"><path d="M50 15 L80 50 L50 85 L20 50 Z" fill={fill} stroke={stroke} strokeWidth="6"/><circle cx="50" cy="50" r="8" fill="currentColor"/></svg>;
            case 'high_school': return <div className="relative flex items-center justify-center"><span className="text-xl font-bold">文</span><div className="absolute inset-0 border-2 border-current rounded-full -m-1"></div></div>;
            case 'bank': return <svg width={size} height={size} viewBox="0 0 100 100"><path d="M50 20 C25 20 25 80 50 80 C75 80 75 20 50 20" fill={fill} stroke={stroke} strokeWidth="10"/></svg>;
            case 'museum': return <svg width={size} height={size} viewBox="0 0 100 100"><path d="M15 80 H85 M25 80 V45 M50 80 V45 M75 80 V45 M15 45 H85 L50 15 Z" fill={fill} stroke={stroke} strokeWidth="6"/></svg>;
            case 'court': return <svg width={size} height={size} viewBox="0 0 100 100"><path d="M50 15 L85 80 H15 Z" fill={fill} stroke={stroke} strokeWidth="10"/><line x1="30" y1="80" x2="70" y2="80" stroke={stroke} strokeWidth="15"/></svg>;
            case 'tax_office': return <svg width={size} height={size} viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill={fill} stroke={stroke} strokeWidth="6"/><line x1="20" y1="50" x2="80" y2="50" stroke={stroke} strokeWidth="6"/><circle cx="50" cy="30" r="6" fill="currentColor"/><circle cx="50" cy="70" r="6" fill="currentColor"/></svg>;
            case 'factory': return <svg width={size} height={size} viewBox="0 0 100 100"><circle cx="50" cy="50" r="28" fill={fill} stroke={stroke} strokeWidth="6"/><path d="M50 10 V25 M50 75 V90 M10 50 H25 M75 50 H90" stroke={stroke} strokeWidth="10"/></svg>;
            case 'library': return <svg width={size} height={size} viewBox="0 0 100 100"><path d="M20 30 Q50 20 80 30 V80 Q50 70 20 80 Z" fill={fill} stroke={stroke} strokeWidth="8"/><line x1="50" y1="25" x2="50" y2="75" stroke={stroke} strokeWidth="4"/></svg>;
            case 'electronic_base': return <svg width={size} height={size} viewBox="0 0 100 100"><path d="M50 15 L85 50 L50 85 L15 50 Z" fill={fill} stroke={stroke} strokeWidth="5"/><rect x="42" y="42" width="16" height="16" fill="currentColor"/></svg>;
            case 'radio_tower': return <svg width={size} height={size} viewBox="0 0 100 100"><path d="M50 10 L80 90 M50 10 L20 90 M20 90 H80 M35 50 H65 M42 30 H58" fill={fill} stroke={stroke} strokeWidth="6"/></svg>;
            case 'chimney': return <svg width={size} height={size} viewBox="0 0 100 100"><rect x="35" y="15" width="30" height="70" fill={fill} stroke={stroke} strokeWidth="8"/><path d="M35 30 H65 M35 50 H65 M35 70 H65" stroke={stroke} strokeWidth="4"/></svg>;
            case 'triangulation': return <svg width={size} height={size} viewBox="0 0 100 100"><path d="M50 15 L90 85 H10 Z" fill={fill} stroke={stroke} strokeWidth="6"/><circle cx="50" cy="55" r="8" fill="currentColor"/></svg>;
            case 'bench_mark': return <svg width={size} height={size} viewBox="0 0 100 100"><rect x="20" y="45" width="60" height="35" fill={fill} stroke={stroke} strokeWidth="8"/><circle cx="50" cy="62" r="8" fill="currentColor"/></svg>;
            case 'important_port': return <svg width={size} height={size} viewBox="0 0 100 100"><path d="M50 15 V80 M30 40 H70 M30 65 Q30 90 50 90 Q70 90 70 65" fill={fill} stroke={stroke} strokeWidth="10"/></svg>;
            case 'waste_land': return <svg width={size} height={size} viewBox="0 0 100 100"><path d="M20 30 L30 50 L20 70 M50 30 L60 50 L50 70 M80 30 L90 50 L80 70" fill={fill} stroke={stroke} strokeWidth="8"/></svg>;
            case 'coniferous': return <svg width={size} height={size} viewBox="0 0 100 100"><path d="M50 20 L80 80 H20 Z" fill={fill} stroke={stroke} strokeWidth="8"/><line x1="50" y1="80" x2="50" y2="90" stroke={stroke} strokeWidth="8"/></svg>;
            case 'broadleaf': return <svg width={size} height={size} viewBox="0 0 100 100"><circle cx="50" cy="45" r="25" fill={fill} stroke={stroke} strokeWidth="8"/><line x1="50" y1="70" x2="50" y2="85" stroke={stroke} strokeWidth="8"/></svg>;
            case 'bamboo': return <svg width={size} height={size} viewBox="0 0 100 100"><path d="M30 20 V85 M50 15 V80 M70 20 V85" fill={fill} stroke={stroke} strokeWidth="8"/><path d="M25 40 H35 M45 35 H55 M65 40 H75" stroke={stroke} strokeWidth="8"/></svg>;
            case 'hot_spring': return <svg width={size} height={size} viewBox="0 0 100 100"><ellipse cx="50" cy="80" rx="35" ry="12" fill={fill} stroke={stroke} strokeWidth="8"/><path d="M35 55 Q40 30 35 15 M50 55 Q55 30 50 15 M65 55 Q70 30 65 15" fill={fill} stroke={stroke} strokeWidth="6"/></svg>;
            case 'oil_well': return <svg width={size} height={size} viewBox="0 0 100 100"><rect x="25" y="25" width="50" height="50" fill={fill} stroke={stroke} strokeWidth="8"/><path d="M25 25 L75 75 M75 25 L25 75" stroke={stroke} strokeWidth="8"/></svg>;
            default: return <span className="text-xl font-bold">?</span>;
          }
        };

        function App() {
          const [screen, setScreen] = useState('landing');
          const [level, setLevel] = useState(null);
          const [blocks, setBlocks] = useState([]);
          const [targetSymbol, setTargetSymbol] = useState(null);
          const [missionCount, setMissionCount] = useState(0);
          const [score, setScore] = useState(0);
          const [message, setMessage] = useState('');
          const [showHint, setShowHint] = useState(false);
          const [timeLeft, setTimeLeft] = useState(15);
          const [isExploding, setIsExploding] = useState(false);
          const timerRef = useRef(null);

          useEffect(() => {
            if (window.lucide) window.lucide.createIcons();
          }, [screen]);

          const initGame = (lvl) => {
            const pool = lvl === 'hell' ? ALL_SYMBOLS : SYMBOLS[`level${lvl}`];
            const newBlocks = [];
            for (let i = 0; i < 48; i++) {
              const s = pool[Math.floor(Math.random() * pool.length)];
              newBlocks.push({ ...s, id_instance: i, visible: true });
            }
            setBlocks(newBlocks); setLevel(lvl); setScreen('game'); setScore(0); setTimeLeft(15); setIsExploding(false);
            generateMission(newBlocks, lvl);
          };

          const generateMission = (currentBlocks, lvl) => {
            const visible = currentBlocks.filter(b => b.visible);
            if (visible.length === 0) { setScreen('result'); return; }
            const uniqueIds = [...new Set(visible.map(b => b.id))];
            const randomId = uniqueIds[Math.floor(Math.random() * uniqueIds.length)];
            const target = ALL_SYMBOLS.find(s => s.id === randomId);
            const count = Math.min(visible.filter(b => b.id === randomId).length, 3);
            setTargetSymbol(target); setMissionCount(count);
            setMessage(`${target.name}を ${count}つ みつけて！`);
          };

          useEffect(() => {
            if (screen === 'game' && level === 'hell' && !isExploding) {
              timerRef.current = setInterval(() => {
                setTimeLeft(prev => {
                  if (prev <= 1) { clearInterval(timerRef.current); setIsExploding(true); setTimeout(() => setScreen('gameover'), 2000); return 0; }
                  return prev - 1;
                });
              }, 1000);
            }
            return () => clearInterval(timerRef.current);
          }, [screen, level, isExploding]);

          const handleBlockClick = (block) => {
            if (isExploding) return;
            if (block.id === targetSymbol.id) {
              const nextBlocks = blocks.map(b => b.id_instance === block.id_instance ? { ...b, visible: false } : b);
              setBlocks(nextBlocks);
              const nextCount = missionCount - 1;
              if (nextCount === 0) {
                setScore(s => s + (level === 'hell' ? 30 : 15));
                setMessage('任務完了！次へ！');
                setTimeout(() => generateMission(nextBlocks, level), 600);
              } else {
                setMissionCount(nextCount); setMessage(`あと ${nextCount}つ！`);
              }
            } else {
              setMessage('ちがうぞ！'); setShowHint(true);
              if (level === 'hell') setTimeLeft(t => Math.max(0, t - 2));
              setTimeout(() => setShowHint(false), 1200);
            }
          };

          return (
            <div className={`min-h-screen p-4 ${isExploding ? 'shake-animation' : ''}`}>
              <div className="max-w-4xl mx-auto bg-white/90 rounded-3xl p-6 shadow-xl min-h-[80vh]">
                {screen === 'landing' && (
                  <div className="text-center py-10">
                    <h1 className="text-4xl font-black mb-6 text-slate-800">精鋭地図博士への道</h1>
                    <p className="mb-10 text-slate-600 font-bold">地図記号をマスターして、最強の冒険者を目指そう！</p>
                    <div className="flex flex-col gap-4 items-center">
                      <button onClick={() => setScreen('home')} className="bg-slate-800 text-white px-10 py-4 rounded-2xl font-bold text-xl hover:scale-105 transition-transform">ゲームスタート</button>
                      <button onClick={() => setScreen('dictionary')} className="text-slate-500 font-bold underline">図鑑をみる</button>
                    </div>
                  </div>
                )}

                {screen === 'dictionary' && (
                  <div>
                    <button onClick={() => setScreen('landing')} className="mb-4 text-slate-400 font-bold">← もどる</button>
                    <h2 className="text-2xl font-black mb-6">地図記号図鑑</h2>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      {ALL_SYMBOLS.map(s => (
                        <div key={s.id} className="flex items-center gap-4 p-3 bg-white rounded-xl border">
                          <div className="w-10 h-10 flex items-center justify-center border rounded bg-slate-50"><MapIcon type={s.id} size="20" /></div>
                          <div><div className="font-bold text-sm">{s.name}</div><div className="text-[10px] text-slate-500">{s.desc}</div></div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {screen === 'home' && (
                  <div className="text-center py-10">
                    <h2 className="text-2xl font-black mb-8 italic uppercase tracking-widest">Mission Select</h2>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                      {[1, 2, 3].map(l => (
                        <button key={l} onClick={() => initGame(l)} className="p-8 border-4 border-slate-800 rounded-2xl bg-white hover:bg-slate-100 font-black">レベル {l}</button>
                      ))}
                      <button onClick={() => initGame('hell')} className="sm:col-span-3 p-6 bg-red-600 text-white rounded-2xl font-black text-xl mt-4">ヘルモード (15秒制限)</button>
                    </div>
                  </div>
                )}

                {screen === 'game' && (
                  <div className="space-y-4">
                    <div className="flex justify-between items-center bg-slate-100 p-4 rounded-xl font-bold">
                      <button onClick={() => setScreen('home')} className="text-slate-400">やめる</button>
                      <div className="flex gap-4">
                        {level === 'hell' && <div className={timeLeft <= 5 ? 'text-red-600 animate-pulse' : ''}>TIME: {timeLeft}s</div>}
                        <div className="text-emerald-600 tracking-wider text-xl">SCORE: {score}</div>
                      </div>
                    </div>
                    <div className="bg-slate-800 text-white p-8 rounded-2xl text-center min-h-[140px] flex flex-col items-center justify-center">
                      <h2 className="text-2xl font-black mb-2">{message}</h2>
                      {showHint && targetSymbol && <div className="bg-white p-2 rounded-lg mt-2"><MapIcon type={targetSymbol.id} size="24" /></div>}
                    </div>
                    <div className="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 gap-2">
                      {blocks.map(b => (
                        <button key={b.id_instance} onClick={() => handleBlockClick(b)} disabled={!b.visible || isExploding} className={`aspect-square rounded-xl bg-white shadow flex items-center justify-center transition-all ${b.visible ? '' : 'opacity-0 scale-0 pointer-events-none'}`}>
                          <MapIcon type={b.id} size="24" />
                        </button>
                      ))}
                    </div>
                  </div>
                )}

                {screen === 'gameover' && (
                  <div className="text-center py-20 bg-red-50 rounded-2xl">
                    <div className="text-6xl mb-4">💥</div>
                    <h2 className="text-3xl font-black text-red-600 mb-8 uppercase tracking-widest">Game Over</h2>
                    <button onClick={() => setScreen('home')} className="bg-slate-800 text-white px-8 py-3 rounded-xl font-bold">メニューにもどる</button>
                  </div>
                )}

                {screen === 'result' && (
                  <div className="text-center py-20">
                    <div className="text-6xl mb-4">🏆</div>
                    <h2 className="text-3xl font-black text-slate-800 mb-8 uppercase tracking-widest">Complete!</h2>
                    <button onClick={() => setScreen('home')} className="bg-emerald-600 text-white px-8 py-3 rounded-xl font-bold">ホームへ</button>
                  </div>
                )}
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
